name: CD - Publish to npm

on:
  push:
    # Trigger when a git tag like `v1.2.3` is pushed
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter (Prettier check)
        run: bun run format:check

      - name: Build plugin
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Configure npm registry auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Publish to npm via Bun
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # bun publish will use the .npmrc auth token
          bun publish --access public --registry https://registry.npmjs.org/
